name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-browser:
    runs-on: ubuntu-latest
    # examples/react-router's own install + typecheck run ahead of the
    # e2e suite (see below). The suite builds all apps serially before
    # Playwright starts its web servers. The install runs only once in CI.
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      # examples/react-router's vite.config.ts imports the plugin's built
      # dist/vite.js directly (see that file), so it must exist before
      # anything loads that config -- both the typecheck below and the E2E
      # preflight/build need the generated Vite entry.
      - run: pnpm build:transform
      # examples/react-router is its own isolated pnpm workspace (own
      # lockfile -- see its pnpm-workspace.yaml), so the root install above
      # doesn't cover it and it isn't typechecked by the root `pnpm
      # typecheck` either. Install and typecheck it here (and only here, in
      # CI), before the e2e run below (which builds apps before server start),
      # so a type error in the example fails fast instead of only
      # surfacing as a build failure.
      - run: pnpm run prepare:e2e
      - run: pnpm --dir examples/react-router run typecheck
      - run: pnpm test:browser
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
