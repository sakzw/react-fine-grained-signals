name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-browser:
    runs-on: ubuntu-latest
    # examples/react-router's own install + typecheck run ahead of the
    # e2e suite (see below), before the suite's react-router build/start via
    # Playwright's webServer. The install runs only once in CI.
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true
      # examples/react-router's vite.config.ts imports the plugin's built
      # dist/vite.js directly (see that file), so it must exist before
      # anything loads that config -- both the typecheck below and the e2e
      # run's webServer parse it.
      - run: pnpm build:transform
      # examples/react-router is its own isolated pnpm workspace (own
      # lockfile -- see its pnpm-workspace.yaml), so the root install above
      # doesn't cover it and it isn't typechecked by the root `pnpm
      # typecheck` either. Install and typecheck it here (and only here, in
      # CI), before the e2e run below (whose webServer builds/starts, not
      # installs), so a type error in the example fails fast instead of only
      # surfacing as a build failure.
      - run: pnpm --dir examples/react-router install --frozen-lockfile
      - run: pnpm --dir examples/react-router run typecheck
      - run: pnpm test:browser
