# Deploy is deliberately manual. Ordinary pushes and pull requests never
# publish the website; build and browser verification run in website-ci.yml.
name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      - name: Pack local RFSG packages
        working-directory: website
        run: node scripts/pack-local-rfsg.mjs
      - uses: pnpm/setup@v3.2.0
        with:
          working-directory: website
          runtime: node@26.13.1
          cache-dependency-path: website/pnpm-lock.yaml
          cache: true
          require-lockfile: true
          install: false
      - name: Install website dependencies
        working-directory: website
        run: pnpm install --no-frozen-lockfile
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build static site
        working-directory: website
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist/public
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
