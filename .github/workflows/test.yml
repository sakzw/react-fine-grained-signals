name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
      - run: pnpm lint
      - run: pnpm typecheck
      # Runs both suites with V8 coverage instrumentation and prints the
      # per-file summary to the log; each vitest.config.ts's
      # coverage.thresholds gates the run on a real regression.
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage/
            packages/unplugin-react-fine-grained-signals/coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm build
      # Runs against the build above rather than `pnpm size`, which would rebuild.
      - run: node scripts/check-size.mjs
      - run: pnpm test:consumer
